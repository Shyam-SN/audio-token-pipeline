[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audio-token-pipeline"
version = "0.1.0"
description = "High-throughput audio tokenization pipeline for training-ready speech codec tokens"
readme = "README.md"
requires-python = ">=3.11, <3.12"
license = "MIT"
authors = [
    { name = "Audio Token Pipeline Authors" }
]
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "duckdb>=1.0.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "soundfile>=0.12.1",
    "av>=12.0.0",
    "pyarrow>=15.0.0",
    "pyloudnorm>=0.1.1",
    "httpx>=0.27.0",
    "pytz>=2024.1",
    "onnxruntime>=1.17.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "hypothesis>=6.100.0",
    "types-pyyaml>=6.0.12",
]
torch = [
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
]

[project.scripts]
atp = "audio_token_pipeline.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "pyarrow",
    "pyarrow.*",
    "soundfile",
    "soundfile.*",
    "pyloudnorm",
    "pyloudnorm.*",
    "torchaudio",
    "torchaudio.*",
    "tqdm",
    "tqdm.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.coverage.run]
omit = [
    "audio_token_pipeline/bench/benchmark_dev_clean.py",
]
